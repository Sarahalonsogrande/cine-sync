<ion-content class="ion-padding">

    <ion-item>
        <ion-input
            [formControl]="controlTitle"
            [clearInput]="true"
            label="Buscapeli..."
            labelPlacement="floating"
        >
        </ion-input>
        <ion-button (click)="findOmdb()">Buscar</ion-button>
    </ion-item>

        <ion-item>
        <ion-input
            [formControl]="controlYear"
            [clearInput]="true"
            label="AÑO..."
            labelPlacement="floating"
            type="number"
        >
        </ion-input>
        <ion-button (click)="findOmdb()">Buscar</ion-button>
    </ion-item>

    @if (error) {
    <ion-text color="danger">{{ error }}</ion-text>
    }

    @if (results.length > 0) {
    <ion-list>
        @for (movie of results; track movie.id) {
        <ion-item>
            <ion-thumbnail slot="start">
                <img [src]="movie.poster !== 'N/A' ? movie.poster : 'assets/imgs/avatar.png'" />
            </ion-thumbnail>
            <ion-label>
                <h2>{{ movie.title }}</h2>
                <p>{{ movie.year }}</p>
            </ion-label>

            <ion-button
                fill="clear"
                color="primary"
                slot="end"
                (click)="addMovie(movie)">
                <ion-icon name="add-circle-outline"></ion-icon>
            </ion-button>
        </ion-item>
        }
    </ion-list>
    }

</ion-content>
