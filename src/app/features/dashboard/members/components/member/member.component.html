<ion-card>
  <div>

    <app-member-personal-detail
      [member]="member()">
    </app-member-personal-detail>

    <ion-row>
      <ion-col size="3">
        <div align="center">
          <ion-label color="dark">Antigüedad</ion-label>
          <p>
            <ion-text color="dark">
              01/06/25
            </ion-text>
          </p>
        </div>
      </ion-col>

      <ion-col size="3">
        <div align="center">
          <ion-label color="dark">Añadidas</ion-label>
          <p>
            <ion-text color="dark">
              3 películas.
            </ion-text>
          </p>
        </div>
      </ion-col>

      <ion-col size="3">
        <div align="center">
          <ion-label color="dark">Favoritos</ion-label>
          <p>
            <ion-text color="dark">
              25 películas.
            </ion-text>
          </p>
        </div>
      </ion-col>

      <ion-col size="3">
        <div align="center">
          <ion-label color="dark">Contribución</ion-label>
          <p>
            <ion-text color="dark">
              250 euros.
            </ion-text>
          </p>
        </div>
      </ion-col>

    </ion-row>

  </div>
</ion-card>
